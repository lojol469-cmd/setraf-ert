---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: setraf-logs-pvc
  namespace: setraf
  labels:
    app: setraf
    component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi


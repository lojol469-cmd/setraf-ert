---
apiVersion: v1
kind: Service
metadata:
  name: setraf-frontend-service
  namespace: setraf
  labels:
    app: setraf
    component: frontend
spec:
  type: LoadBalancer
  selector:
    app: setraf
    component: frontend
  ports:
  - name: streamlit
    port: 8504
    targetPort: 8504
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: v1
kind: Service
metadata:
  name: setraf-backend-service
  namespace: setraf
  labels:
    app: setraf
    component: backend
spec:
  type: ClusterIP
  selector:
    app: setraf
    component: backend
  ports:
  - name: api
    port: 5000
    targetPort: 5000
    protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: setraf-api-service
  namespace: setraf
  labels:
    app: setraf
    component: api
spec:
  type: ClusterIP
  selector:
    app: setraf
    component: api
  ports:
  - name: fastapi
    port: 8505
    targetPort: 8505
    protocol: TCP

---
# Service headless pour communication interne
apiVersion: v1
kind: Service
metadata:
  name: setraf-internal
  namespace: setraf
  labels:
    app: setraf
spec:
  clusterIP: None
  selector:
    app: setraf
  ports:
  - name: frontend
    port: 8504
    targetPort: 8504
  - name: backend
    port: 5000
    targetPort: 5000
  - name: api
    port: 8505
    targetPort: 8505

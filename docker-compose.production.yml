# =====================================================
# SETRAF - Docker Compose Configuration PRODUCTION
# Configuration optimisée avec volumes persistants
# =====================================================

version: '3.8'

services:
  setraf:
    image: belikanm/setraf:latest
    container_name: setraf-production
    
    build:
      context: .
      dockerfile: Dockerfile.optimized
      args:
        - BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    
    ports:
      - "8504:8504"  # Streamlit ERTest.py
      - "8505:8505"  # API FastAPI (si utilisé)
    
    volumes:
      # Volume PERSISTANT pour cache HuggingFace (CRITIQUE)
      - huggingface-cache:/root/.cache/huggingface
      
      # Données de l'application
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./exports:/app/exports
      - ./logs:/app/logs
      
      # Base vectorielle RAG
      - ./rag_documents:/app/rag_documents
      - ./vector_db:/app/vector_db
      - ./ml_models:/app/ml_models
      
      # Configuration (lecture seule)
      - ./.env:/app/.env:ro
    
    environment:
      # Configuration HuggingFace
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
      - HF_DATASETS_CACHE=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      
      # Configuration Streamlit
      - STREAMLIT_SERVER_PORT=8504
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      
      # Configuration TensorFlow/PyTorch
      - CUDA_VISIBLE_DEVICES=-1
      - TF_CPP_MIN_LOG_LEVEL=2
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      
      # Configuration API keys
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      
      # Contrôle du téléchargement
      - DOWNLOAD_MISTRAL=false  # true pour télécharger Mistral au démarrage
      
      # Configuration application
      - PYTHONUNBUFFERED=1
      - TZ=Africa/Libreville
    
    restart: unless-stopped
    
    networks:
      - setraf-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8504/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s  # 3 minutes pour le téléchargement des modèles
    
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Configuration réseau
networks:
  setraf-network:
    driver: bridge

# Volumes persistants
volumes:
  # Volume CRITIQUE: Cache des modèles HuggingFace
  # Ce volume permet de ne télécharger les modèles qu'une seule fois
  huggingface-cache:
    driver: local
